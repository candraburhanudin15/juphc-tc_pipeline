apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  generateName: tax-calculator-pipeline-run-
spec:
  pipelineRef:
    name: tax-calculator-pipeline
  workspaces:
    - name: pipeline-ws
      persistentVolumeClaim:
        claimName: tekton-pvc
  params:
    - name: repo-url
      value: "https://github.com/<your-username>/tax-calculator.git"
    - name: revision
      value: "main"
    - name: image-name
      value: "us.icr.io/<your-namespace>/tax-calculator:latest"
